name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang platform dan build-tools
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit test + build debug
        run: |
          set +e
          ./gradlew testDebugUnitTest assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            # Ringkas error ke anotasi supaya terbaca tanpa membuka log penuh
            MSG=$(grep -E "^e: |error:|What went wrong|FAILED|Caused by|Execution failed|Could not|AssertionError|expected:|Exception" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Ringkasan error build::$MSG"
          fi
          exit $CODE

      - name: Siapkan keystore rilis (bila secret tersedia)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > keystore.properties
            ./gradlew assembleRelease --stacktrace
          else
            echo "Secret keystore tidak ada; lewati build rilis."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/distribusi/*.apk
            app/build/outputs/mapping/distribusi/mapping.txt
          if-no-files-found: warn

      - name: Build APK distribusi (R8 + penyusutan resource)
        run: ./gradlew assembleDistribusi --stacktrace --console=plain

      - name: Terbitkan APK distribusi ke Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete terbaru --cleanup-tag --yes || true
          gh release create terbaru app/build/outputs/apk/distribusi/*.apk \
            --title "APK terbaru (diperkecil R8)" --notes "Dibangun otomatis dari commit ${GITHUB_SHA::7}. Bisa menimpa pemasangan lama tanpa menghapus data." --prerelease

      - name: Terbitkan APK Pemberi Lisensi (khusus pemilik) ke Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pemberi-lisensi --cleanup-tag --yes || true
          cp pemberi/build/outputs/apk/distribusi/*.apk PemberiLisensi.apk
          gh release create pemberi-lisensi PemberiLisensi.apk \
            --title "Pemberi Lisensi (khusus pemilik)" --notes "Jangan dibagikan ke staff. Dibangun dari commit ${GITHUB_SHA::7}." --prerelease

      - name: Terbitkan APK debug ke Releases (mudah diunduh dari HP)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest app/build/outputs/apk/debug/*.apk \
            --title "APK debug terbaru" --notes "Dibangun otomatis dari commit ${GITHUB_SHA::7}. Pasang di HP (izinkan sumber tidak dikenal)." --prerelease

      - name: Unggah laporan bila gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: laporan-build
          path: |
            app/build/reports/
          if-no-files-found: ignore

  # Uji kesiapan Play Store: R8 + AAB + selaras 16 KB. Terpisah agar publikasi APK debug tidak terhalang.
  play-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Pasang platform dan build-tools
        run: |
          SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build rilis (R8) + AAB tanpa tanda tangan
        run: |
          set +e
          ./gradlew assembleRelease bundleRelease --stacktrace --console=plain 2>&1 | tee build.log
          CODE=${PIPESTATUS[0]}
          if [ "$CODE" != "0" ]; then
            MSG=$(grep -E "^e: |error:|Missing class|R8|What went wrong|Caused by|Execution failed" build.log | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Ringkasan error build rilis::$MSG"
          fi
          exit $CODE
      - name: Periksa selaras 16 KB
        run: |
          for f in app/build/outputs/apk/release/*.apk app/build/outputs/bundle/release/*.aab; do
            echo "== $f"; ./scripts/cek_16kb.sh "$f" || FAIL=1
          done
          exit ${FAIL:-0}
      - name: Periksa zipalign 16 KB pada APK
        run: |
          ZA=$(ls "$ANDROID_HOME"/build-tools/36.0.0/zipalign)
          for f in app/build/outputs/apk/release/*.apk; do "$ZA" -c -P 16 -v 4 "$f" | tail -3; done || true
      - uses: actions/upload-artifact@v4
        with:
          name: rilis-play
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
